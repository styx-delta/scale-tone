<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-title" content="Scale-Tone">
  <meta name="application-name" content="Scale-Tone">
  <title>Scale-Tone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
        touch-action: manipulation; 
        -webkit-touch-callout: none;
    }
    
    /* 鍵盤コンテナ：16列のグリッドでピアノの配置を再現 */
    .piano-grid {
        display: grid;
        grid-template-columns: repeat(16, minmax(0, 1fr));
        gap: 4px;
        width: 100%;
        margin: 0 auto;
    }
    
    /* ボタンを完全な正方形 (aspect-square) に固定 */
    .key-btn {
        grid-column-end: span 2;
        aspect-ratio: 1 / 1;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-weight: bold;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        transition: all 0.1s;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        font-size: clamp(0.8rem, 2vw + 0.5rem, 1.25rem);
    }
    
    .key-active {
        background-color: #3b82f6 !important;
        color: white !important;
        box-shadow: inset 0 4px 6px rgba(0,0,0,0.2) !important;
        transform: scale(0.95);
    }
    
    /* 上段（黒鍵）と下段（白鍵）の設定 */
    .key-black { background-color: #374151; color: white; border: 2px solid #1f2937; grid-row: 1; }
    .key-white { background-color: white; color: #1f2937; border: 2px solid #e5e7eb; grid-row: 2; }
  </style>
</head>
<body class="bg-gray-200 min-h-screen flex flex-col items-center py-6 px-4">
  
  <div class="w-full max-w-3xl flex flex-col items-center">

    <!-- 設定項目パネル (常に表示・余白を適正化) -->
    <div class="w-full bg-white rounded-lg shadow-sm px-4 py-3 mb-6">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">Key (C3 - C4)</label>
          <select id="key-select" class="w-full p-2 border rounded bg-gray-50 text-sm outline-none cursor-pointer">
            <option value="48" selected>C3</option>
            <option value="49">C#3</option>
            <option value="50">D3</option>
            <option value="51">D#3</option>
            <option value="52">E3</option>
            <option value="53">F3</option>
            <option value="54">F#3</option>
            <option value="55">G3</option>
            <option value="56">G#3</option>
            <option value="57">A3</option>
            <option value="58">A#3</option>
            <option value="59">B3</option>
            <option value="60">C4</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">Waveform</label>
          <select id="wave-select" class="w-full p-2 border rounded bg-gray-50 text-sm outline-none cursor-pointer">
            <option value="sine" selected>Sine (純音)</option>
            <option value="square">Square (電子音)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">Mode</label>
          <select id="mode-select" class="w-full p-2 border rounded bg-gray-50 text-sm outline-none cursor-pointer">
            <option value="single" selected>単音 (Single)</option>
            <option value="multiple">和音 (Multiple)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 鍵盤エリア (不自然な空きスペースを無くし、自然な位置に配置) -->
    <div class="w-full">
      <div id="keyboard-container" class="piano-grid">
        <!-- JSでボタンを生成 -->
      </div>
    </div>
    
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const keyboardContainer = document.getElementById('keyboard-container');
    const keySelect = document.getElementById('key-select');
    const waveSelect = document.getElementById('wave-select');
    const modeSelect = document.getElementById('mode-select');

    let baseNote = 48;
    let waveType = 'sine';
    let playMode = 'single';
    const activeOscillators = {};

    const intervals = [
      { name: "C", isBlack: false },
      { name: "C#", isBlack: true },
      { name: "D", isBlack: false },
      { name: "D#", isBlack: true },
      { name: "E", isBlack: false },
      { name: "F", isBlack: false },
      { name: "F#", isBlack: true },
      { name: "G", isBlack: false },
      { name: "G#", isBlack: true },
      { name: "A", isBlack: false },
      { name: "A#", isBlack: true },
      { name: "B", isBlack: false },
      { name: "C", isBlack: false }
    ];

    // 16列グリッドにおける、各ボタンの開始位置 (1から始まる)
    const gridStartCols = [
      1,   // C
      2,   // C#
      3,   // D
      4,   // D#
      5,   // E
      7,   // F  (EとFの間には黒鍵がないので6を飛ばす)
      8,   // F#
      9,   // G
      10,  // G#
      11,  // A
      12,  // A#
      13,  // B
      15   // C(高) (BとCの間には黒鍵がないので14を飛ばす)
    ];

    function noteToFreq(note) { return 440 * Math.pow(2, (note - 69) / 12); }

    function playNote(note, btnId, btnElement) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      if (activeOscillators[btnId]) {
        stopNote(btnId, btnElement);
        return;
      }

      if (playMode === 'single') {
        Object.keys(activeOscillators).forEach(id => {
          const el = document.getElementById(id);
          if (el) stopNote(id, el);
        });
      }

      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = waveType;
      osc.frequency.value = noteToFreq(note);

      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();

      activeOscillators[btnId] = { osc, gainNode };
      btnElement.classList.add('key-active');
    }

    function stopNote(btnId, btnElement) {
      if (activeOscillators[btnId]) {
        const { osc, gainNode } = activeOscillators[btnId];
        gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
        osc.stop(audioCtx.currentTime + 0.05);
        delete activeOscillators[btnId];
        btnElement.classList.remove('key-active');
      }
    }

    function renderKeyboard() {
      keyboardContainer.innerHTML = '';
      Object.keys(activeOscillators).forEach(id => {
        const el = document.getElementById(id);
        if(el) stopNote(id, el);
      });

      intervals.forEach((interval, index) => {
        const currentNote = baseNote + index;
        const btn = document.createElement('button');
        const btnId = `btn-${index}`;
        btn.id = btnId;
        
        btn.className = `key-btn ${interval.isBlack ? 'key-black' : 'key-white'}`;
        btn.style.gridColumnStart = gridStartCols[index];
        btn.innerHTML = `<span>${interval.name}</span>`;

        btn.addEventListener('pointerdown', (e) => { 
            if(e.pointerType === 'mouse' && e.button !== 0) return;
            e.preventDefault(); 
            playNote(currentNote, btnId, btn); 
        });

        keyboardContainer.appendChild(btn);
      });
    }

    keySelect.addEventListener('change', (e) => { baseNote = parseInt(e.target.value); renderKeyboard(); });
    waveSelect.addEventListener('change', (e) => { waveType = e.target.value; });
    modeSelect.addEventListener('change', (e) => { playMode = e.target.value; });

    renderKeyboard();
  </script>
</body>
</html>
