<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-title" content="Scale-Tone">
  <meta name="application-name" content="Scale-Tone">
  <title>Scale-Tone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 横画面時のボタンの縦幅を最大化する */
    @media (orientation: landscape) {
      .key-btn {
        height: 100%;
        min-height: 60px;
      }
    }
  </style>
</head>
<body class="bg-gray-100 touch-manipulation select-none h-screen overflow-hidden flex flex-col">
  <div class="max-w-4xl mx-auto w-full p-4 flex flex-col h-full">
    
    <!-- タイトルと設定トグルボタン -->
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-3xl font-bold text-gray-800">Scale-Tone</h1>
      <button id="toggle-settings-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 px-4 rounded shadow-sm flex items-center transition">
        ⚙️ 設定
      </button>
    </div>

    <!-- 設定パネル（開閉可能） -->
    <div id="settings-panel" class="mb-4 bg-white p-4 rounded shadow-sm transition-all duration-300">
      <div class="flex flex-col sm:flex-row gap-4 justify-between">
        
        <!-- キー変更 -->
        <div class="flex-1">
          <label class="block text-sm font-bold text-gray-700 mb-1">Key (C3 - C4)</label>
          <select id="key-select" class="w-full p-2 border rounded bg-gray-50 text-lg">
            <option value="C3" data-note="48" selected>C3</option>
            <option value="C#3" data-note="49">C#3 / Db3</option>
            <option value="D3" data-note="50">D3</option>
            <option value="D#3" data-note="51">D#3 / Eb3</option>
            <option value="E3" data-note="52">E3</option>
            <option value="F3" data-note="53">F3</option>
            <option value="F#3" data-note="54">F#3 / Gb3</option>
            <option value="G3" data-note="55">G3</option>
            <option value="G#3" data-note="56">G#3 / Ab3</option>
            <option value="A3" data-note="57">A3</option>
            <option value="A#3" data-note="58">A#3 / Bb3</option>
            <option value="B3" data-note="59">B3</option>
            <option value="C4" data-note="60">C4</option>
          </select>
        </div>

        <!-- 音色変更 -->
        <div class="flex-1">
          <label class="block text-sm font-bold text-gray-700 mb-1">Waveform</label>
          <select id="wave-select" class="w-full p-2 border rounded bg-gray-50 text-lg">
            <option value="sine" selected>Sine (純音)</option>
            <option value="square">Square (電子音)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 鍵盤エリア（設定を閉じるとこの部分が画面いっぱいに広がる） -->
    <div id="keyboard-container" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2 flex-grow pb-4">
      <!-- JavaScriptでボタンを生成 -->
    </div>
    
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const keyboardContainer = document.getElementById('keyboard-container');
    const keySelect = document.getElementById('key-select');
    const waveSelect = document.getElementById('wave-select');
    const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
    const settingsPanel = document.getElementById('settings-panel');

    // C3を基準（MIDIノート番号48）
    let baseNote = 48;
    let waveType = 'sine';
    
    // 現在鳴っている音を管理するオブジェクト
    const activeOscillators = {};

    // 13半音分の相対表記
    const intervals = [
      { name: "C", diff: 0 },
      { name: "C# / Db", diff: 1 },
      { name: "D", diff: 2 },
      { name: "D# / Eb", diff: 3 },
      { name: "E", diff: 4 },
      { name: "F", diff: 5 },
      { name: "F# / Gb", diff: 6 },
      { name: "G", diff: 7 },
      { name: "G# / Ab", diff: 8 },
      { name: "A", diff: 9 },
      { name: "A# / Bb", diff: 10 },
      { name: "B", diff: 11 },
      { name: "C", diff: 12 },
    ];

    // 周波数計算 (A4=440Hz, 基準MIDIノート69)
    function noteToFreq(note) {
      return 440 * Math.pow(2, (note - 69) / 12);
    }

    // 音を鳴らす
    function playNote(note, btnId, btnElement) {
      // AudioContextが停止している場合は再開させる（iOS対応）
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // 既に鳴っている場合は止める（トグル機能）
      if (activeOscillators[btnId]) {
        stopNote(btnId, btnElement);
        return;
      }

      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      osc.type = waveType;
      osc.frequency.value = noteToFreq(note);

      // プツッというノイズを防ぐためのエンベロープ処理
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();

      activeOscillators[btnId] = { osc, gainNode };
      
      // ボタンの見た目をアクティブにする
      btnElement.classList.remove('bg-white', 'text-gray-800');
      btnElement.classList.add('bg-blue-500', 'text-white', 'shadow-inner');
    }

    // 音を止める
    function stopNote(btnId, btnElement) {
      if (activeOscillators[btnId]) {
        const { osc, gainNode } = activeOscillators[btnId];
        
        // 滑らかに音を消す
        gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
        
        osc.stop(audioCtx.currentTime + 0.05);
        delete activeOscillators[btnId];

        // ボタンの見た目を元に戻す
        btnElement.classList.remove('bg-blue-500', 'text-white', 'shadow-inner');
        btnElement.classList.add('bg-white', 'text-gray-800');
      }
    }

    // 鍵盤を描画する
    function renderKeyboard() {
      // 鍵盤の初期化と、鳴っている音のリセット
      keyboardContainer.innerHTML = '';
      Object.keys(activeOscillators).forEach(id => stopNote(id, document.getElementById(id)));

      intervals.forEach((interval, index) => {
        const currentNote = baseNote + interval.diff;
        
        const btn = document.createElement('button');
        const btnId = `key-btn-${index}`;
        btn.id = btnId;
        // flex-growなどを使って高さを自動調整させる
        btn.className = "key-btn bg-white text-gray-800 font-bold text-xl sm:text-2xl rounded-lg shadow border border-gray-200 flex items-center justify-center transition-colors";
        btn.innerText = interval.name;

        btn.addEventListener('click', () => {
          playNote(currentNote, btnId, btn);
        });

        keyboardContainer.appendChild(btn);
      });
    }

    // 設定パネルの開閉処理
    document.getElementById('toggle-settings-btn').addEventListener('click', () => {
      if (settingsPanel.classList.contains('hidden')) {
        settingsPanel.classList.remove('hidden');
      } else {
        settingsPanel.classList.add('hidden');
      }
    });

    // キー変更のイベント
    keySelect.addEventListener('change', (e) => {
      const selectedOption = e.target.options[e.target.selectedIndex];
      baseNote = parseInt(selectedOption.getAttribute('data-note'));
      renderKeyboard();
    });

    // 音色変更のイベント
    waveSelect.addEventListener('change', (e) => {
      waveType = e.target.value;
    });

    // 初期描画
    renderKeyboard();
  </script>
</body>
</html>
