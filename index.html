<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-title" content="Scale-Tone">
  <meta name="application-name" content="Scale-Tone">
  <title>Scale-Tone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      touch-action: manipulation; 
    }
    
    /* 鍵盤エリア全体の枠 */
    .keyboard-container {
      --gap: 6px;
      /* 8個の白鍵と7個の隙間から、1個あたりの正確な正方形サイズを算出 */
      --key-size: calc((100% - (7 * var(--gap))) / 8);
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* 黒鍵コンテナ: 上段 */
    .black-keys {
      display: flex;
      gap: var(--gap);
      margin-bottom: var(--gap);
      /* 白鍵の半個分 + 隙間の半個分だけ右にズラすことで、隣り合う白鍵のちょうど真ん中に配置 */
      margin-left: calc((var(--key-size) + var(--gap)) / 2);
      pointer-events: none;
    }

    /* 白鍵コンテナ: 下段 */
    .white-keys {
      display: flex;
      gap: var(--gap);
    }

    /* ボタン共通（完全な正方形） */
    .key-btn {
      width: var(--key-size);
      height: var(--key-size);
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.25rem;
      border-radius: 0.5rem;
      cursor: pointer;
      user-select: none;
      pointer-events: auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.1s, transform 0.05s;
    }

    .white-key {
      background-color: white;
      color: #1f2937;
      border: 1px solid #d1d5db;
    }

    .black-key {
      background-color: #374151; /* gray-700 */
      color: white;
    }

    /* Clearボタン: C4（一番右の白鍵）の真上、黒鍵と同じ段に配置 */
    .clear-key {
      position: absolute;
      top: 0;
      right: 0;
      background-color: #ef4444; /* red-500 */
      color: white;
    }
    .clear-key:active {
      background-color: #dc2626; /* red-600 */
      transform: scale(0.96);
    }

    /* 黒鍵がない場所（E-F間、B-C間）の透明なスペーサー */
    .spacer { 
      width: var(--key-size);
      height: var(--key-size);
      flex-shrink: 0;
      visibility: hidden; 
      pointer-events: none; 
    }
    
    /* 音が鳴っている時のスタイル */
    .active {
      background-color: #3b82f6 !important; /* blue-500 */
      color: white !important;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2) !important;
    }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col p-4 overflow-hidden select-none">
  
  <!-- 設定項目 (タイトルなし、隙間を詰めた配置) -->
  <div class="flex flex-col sm:flex-row gap-3 mb-4 w-full max-w-[800px] mx-auto">
    <div class="flex-1">
      <label class="block text-xs font-bold text-gray-500 mb-1">Key (C3 - C4)</label>
      <select id="key-select" class="w-full p-2 border rounded bg-white text-base shadow-sm">
        <option value="48" selected>C3</option>
        <option value="49">C#3 / Db3</option>
        <option value="50">D3</option>
        <option value="51">D#3 / Eb3</option>
        <option value="52">E3</option>
        <option value="53">F3</option>
        <option value="54">F#3 / Gb3</option>
        <option value="55">G3</option>
        <option value="56">G#3 / Ab3</option>
        <option value="57">A3</option>
        <option value="58">A#3 / Bb3</option>
        <option value="59">B3</option>
        <option value="60">C4</option>
      </select>
    </div>
    <div class="flex-1">
      <label class="block text-xs font-bold text-gray-500 mb-1">Waveform</label>
      <select id="wave-select" class="w-full p-2 border rounded bg-white text-base shadow-sm">
        <option value="sine" selected>Sine (純音)</option>
        <option value="square">Square (電子音)</option>
      </select>
    </div>
    <div class="flex-1">
      <label class="block text-xs font-bold text-gray-500 mb-1">Mode</label>
      <select id="mode-select" class="w-full p-2 border rounded bg-white text-base shadow-sm">
        <option value="single" selected>単音 (Single)</option>
        <option value="multi">複数音 (Multi)</option>
      </select>
    </div>
  </div>

  <!-- 鍵盤エリア -->
  <div class="keyboard-container">
    <!-- 黒鍵 (上段) -->
    <div class="black-keys">
      <div class="key-btn black-key" id="key-1">C#</div>
      <div class="key-btn black-key" id="key-3">D#</div>
      <div class="spacer"></div> <!-- EとFの間 -->
      <div class="key-btn black-key" id="key-6">F#</div>
      <div class="key-btn black-key" id="key-8">G#</div>
      <div class="key-btn black-key" id="key-10">A#</div>
      <div class="spacer"></div> <!-- BとCの間 -->
    </div>

    <!-- Clearボタン (C4の真上・黒鍵と同じ段) -->
    <div class="key-btn clear-key" id="clear-btn" title="Clear All Notes">C</div>
    
    <!-- 白鍵 (下段) -->
    <div class="white-keys">
      <div class="key-btn white-key" id="key-0">C</div>
      <div class="key-btn white-key" id="key-2">D</div>
      <div class="key-btn white-key" id="key-4">E</div>
      <div class="key-btn white-key" id="key-5">F</div>
      <div class="key-btn white-key" id="key-7">G</div>
      <div class="key-btn white-key" id="key-9">A</div>
      <div class="key-btn white-key" id="key-11">B</div>
      <div class="key-btn white-key" id="key-12">C</div>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let baseNote = 48; // C3
    let waveType = 'sine';
    let isMultiMode = false;
    const activeOscillators = {};

    // 指定ルールに基づく12音名の配列（E#, B#を使わずF, Cとし、派生音は#表記）
    const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    // 13半音のIDと間隔のマッピング
    const intervals = {
      'key-0': 0, 'key-1': 1, 'key-2': 2, 'key-3': 3, 'key-4': 4,
      'key-5': 5, 'key-6': 6, 'key-7': 7, 'key-8': 8, 'key-9': 9,
      'key-10': 10, 'key-11': 11, 'key-12': 12
    };

    // キーに合わせてすべての鍵盤の文字を更新する関数
    function updateKeyLabels() {
      Object.keys(intervals).forEach(id => {
        const btn = document.getElementById(id);
        const currentNote = baseNote + intervals[id];
        btn.innerText = noteNames[currentNote % 12];
      });
    }

    document.getElementById('key-select').addEventListener('change', (e) => {
      baseNote = parseInt(e.target.value);
      stopAllNotes();
      updateKeyLabels();
    });
    
    document.getElementById('wave-select').addEventListener('change', (e) => {
      waveType = e.target.value;
    });
    
    document.getElementById('mode-select').addEventListener('change', (e) => {
      isMultiMode = e.target.value === 'multi';
      stopAllNotes();
    });

    // Clearボタンのイベント
    document.getElementById('clear-btn').addEventListener('click', () => {
      stopAllNotes();
    });

    function noteToFreq(note) {
      return 440 * Math.pow(2, (note - 69) / 12);
    }

    function stopAllNotes() {
      Object.keys(activeOscillators).forEach(id => {
        stopNote(id, document.getElementById(id));
      });
    }

    function stopNote(btnId, btnElement) {
      if (activeOscillators[btnId]) {
        const { osc, gainNode } = activeOscillators[btnId];
        gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
        osc.stop(audioCtx.currentTime + 0.05);
        delete activeOscillators[btnId];
        btnElement.classList.remove('active');
      }
    }

    function playNote(interval, btnId, btnElement) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (activeOscillators[btnId]) {
        stopNote(btnId, btnElement);
        return;
      }

      if (!isMultiMode) {
        stopAllNotes();
      }

      const currentNote = baseNote + interval;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      osc.type = waveType;
      osc.frequency.value = noteToFreq(currentNote);

      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();

      activeOscillators[btnId] = { osc, gainNode };
      btnElement.classList.add('active');
    }

    // 各ボタンにクリックイベントを追加
    Object.keys(intervals).forEach(id => {
      const btn = document.getElementById(id);
      btn.addEventListener('click', () => {
        playNote(intervals[id], id, btn);
      });
    });

    // 初期表示時のラベル更新
    updateKeyLabels();
  </script>
</body>
</html>
