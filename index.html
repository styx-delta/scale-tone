<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- スマホ・タブ用のタイトル設定 -->
    <title>Scale-Tone</title>
    <meta name="apple-mobile-web-app-title" content="Scale-Tone">
    <meta name="application-name" content="Scale-Tone">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 鍵盤レイアウト用カスタムCSS */
        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            /* タップ時のハイライトを無効化 */
            -webkit-tap-highlight-color: transparent; 
        }

        .key {
            aspect-ratio: 1 / 1; /* 完全な正方形 */
            margin: 2px; /* 隙間 */
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: clamp(0.7rem, 2.5vw, 1.25rem);
            cursor: pointer;
            user-select: none;
            touch-action: manipulation; /* スマホでのズーム防止 */
            transition: transform 0.1s, background-color 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        /* 押下時のアニメーション */
        .key:active {
            transform: scale(0.95);
        }

        /* 上段（黒鍵ポジション） */
        .key-black {
            grid-row: 1;
            background-color: #374151; /* 濃いグレー */
            color: #F3F4F6;
        }

        /* 下段（白鍵ポジション） */
        .key-white {
            grid-row: 2;
            background-color: #FFFFFF;
            color: #1F2937;
        }

        /* アクティブ（発音中）のスタイル */
        .key.active {
            background-color: #3B82F6; /* ブルー */
            color: #FFFFFF;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
            border-color: #2563EB;
        }

        /* --- 各ボタンのグリッド配置（全16列中、2列分ずつ使用して半分ずらす） --- */
        /* 下段（白鍵）: 0, 2, 4, 5, 7, 9, 11, 12 */
        .key[data-note="0"]  { grid-column: 1 / 3; }
        .key[data-note="2"]  { grid-column: 3 / 5; }
        .key[data-note="4"]  { grid-column: 5 / 7; }
        .key[data-note="5"]  { grid-column: 7 / 9; }
        .key[data-note="7"]  { grid-column: 9 / 11; }
        .key[data-note="9"]  { grid-column: 11 / 13; }
        .key[data-note="11"] { grid-column: 13 / 15; }
        .key[data-note="12"] { grid-column: 15 / 17; }

        /* 上段（黒鍵）: 1, 3, 6, 8, 10 */
        .key[data-note="1"]  { grid-column: 2 / 4; }
        .key[data-note="3"]  { grid-column: 4 / 6; }
        .key[data-note="6"]  { grid-column: 8 / 10; }
        .key[data-note="8"]  { grid-column: 10 / 12; }
        .key[data-note="10"] { grid-column: 12 / 14; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col items-center p-2 sm:p-4 overflow-hidden">

    <div class="w-full max-w-4xl flex flex-col h-full">
        
        <!-- コントロールパネル（設定項目） -->
        <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-gray-200 mb-2 sm:mb-4 flex flex-wrap gap-2 justify-between items-center">
            <!-- キー選択 -->
            <div class="flex-1 min-w-[30%]">
                <label for="keySelect" class="block text-xs font-semibold text-gray-500 mb-1">Key (C3-C4)</label>
                <select id="keySelect" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2">
                    <!-- JSで動的に追加 -->
                </select>
            </div>

            <!-- 音色選択 -->
            <div class="flex-1 min-w-[30%]">
                <label for="waveSelect" class="block text-xs font-semibold text-gray-500 mb-1">Waveform</label>
                <select id="waveSelect" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2">
                    <option value="sine">Sine (純音)</option>
                    <option value="square">Square (電子音)</option>
                </select>
            </div>

            <!-- モード選択 -->
            <div class="flex-1 min-w-[30%]">
                <label for="modeSelect" class="block text-xs font-semibold text-gray-500 mb-1">Mode</label>
                <select id="modeSelect" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2">
                    <option value="single">単音 (Single)</option>
                    <option value="multiple">和音 (Multiple)</option>
                </select>
            </div>
        </div>

        <!-- 鍵盤エリア -->
        <div class="keyboard-grid flex-grow content-center" id="keyboard">
            <!-- 上段（黒鍵ポジション） -->
            <div class="key key-black" data-note="1"></div>
            <div class="key key-black" data-note="3"></div>
            <div class="key key-black" data-note="6"></div>
            <div class="key key-black" data-note="8"></div>
            <div class="key key-black" data-note="10"></div>
            
            <!-- 下段（白鍵ポジション） -->
            <div class="key key-white" data-note="0"></div>
            <div class="key key-white" data-note="2"></div>
            <div class="key key-white" data-note="4"></div>
            <div class="key key-white" data-note="5"></div>
            <div class="key key-white" data-note="7"></div>
            <div class="key key-white" data-note="9"></div>
            <div class="key key-white" data-note="11"></div>
            <div class="key key-white" data-note="12"></div>
        </div>
        
    </div>

    <script>
        // --- Web Audio API ---
        let audioCtx;
        const activeNotes = new Map();

        // 12音階の定義（E#, B# は自動的にF, Cとして扱われる）
        const noteNames = ['C', 'C# / Db', 'D', 'D# / Eb', 'E', 'F', 'F# / Gb', 'G', 'G# / Ab', 'A', 'A# / Bb', 'B'];
        const A4_FREQ = 440.0;
        const A4_MIDI = 69;

        // --- DOM要素取得 ---
        const keySelect = document.getElementById('keySelect');
        const waveSelect = document.getElementById('waveSelect');
        const modeSelect = document.getElementById('modeSelect');
        const keys = document.querySelectorAll('.key');

        // --- 初期設定 ---
        function initUI() {
            // C3(48) ~ C4(60) の選択肢を生成
            for (let i = 48; i <= 60; i++) {
                const option = document.createElement('option');
                option.value = i;
                const noteName = noteNames[i % 12].split(' ')[0]; // 短い名前（例：C#）だけをOptionに表示
                const octave = Math.floor(i / 12) - 1;
                option.textContent = `${noteName}${octave}`;
                keySelect.appendChild(option);
            }
            keySelect.value = "48"; // デフォルト: C3
            updateLabels();
        }

        // 鍵盤のテキストを更新（Key変更時）
        function updateLabels() {
            const baseMidi = parseInt(keySelect.value);
            keys.forEach(key => {
                const interval = parseInt(key.dataset.note);
                const midi = baseMidi + interval;
                key.textContent = noteNames[midi % 12];
            });
        }

        // 周波数計算
        function getFrequency(midi) {
            return A4_FREQ * Math.pow(2, (midi - A4_MIDI) / 12);
        }

        // 音を鳴らす・止めるトグル処理
        function toggleNote(interval, buttonElement) {
            // AudioContextの初期化・再開 (スマホでの音出し必須処理)
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const mode = modeSelect.value;
            
            // すでに鳴っている音なら止める
            if (activeNotes.has(interval)) {
                stopNote(interval);
                return;
            }

            // 単音モードなら他の音をすべて止める
            if (mode === 'single') {
                stopAllNotes();
            }

            // 発音処理
            const baseMidi = parseInt(keySelect.value);
            const freq = getFrequency(baseMidi + interval);

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = waveSelect.value;
            osc.frequency.value = freq;

            // 波形ごとの音量調整（Squareは倍音が強くうるさいため小さくする）
            const maxVol = waveSelect.value === 'square' ? 0.05 : 0.2;
            
            // ノイズを防ぐフェードイン
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(maxVol, audioCtx.currentTime + 0.02);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();

            // 状態保存と見た目の変更
            activeNotes.set(interval, { osc, gain, buttonElement });
            buttonElement.classList.add('active');
        }

        // 特定の音を止める処理
        function stopNote(interval) {
            const note = activeNotes.get(interval);
            if (note) {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                
                // ノイズを防ぐフェードアウト
                note.gain.gain.cancelScheduledValues(audioCtx.currentTime);
                note.gain.gain.setValueAtTime(note.gain.gain.value, audioCtx.currentTime);
                note.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                note.osc.stop(audioCtx.currentTime + 0.05);
                
                note.buttonElement.classList.remove('active');
                activeNotes.delete(interval);
            }
        }

        // すべての音を止める処理
        function stopAllNotes() {
            for (let interval of activeNotes.keys()) {
                stopNote(interval);
            }
        }

        // --- イベントリスナー ---

        // 設定変更時のリセットとラベル更新
        keySelect.addEventListener('change', () => {
            stopAllNotes();
            updateLabels();
        });
        modeSelect.addEventListener('change', stopAllNotes);
        waveSelect.addEventListener('change', stopAllNotes);

        // 鍵盤ボタンのイベント登録
        // click ではなく pointerdown に統一してスマホの反応とAudioContext起動を最適化
        keys.forEach(key => {
            key.addEventListener('pointerdown', (e) => {
                e.preventDefault(); // タッチ時の不要な挙動を防止
                toggleNote(parseInt(key.dataset.note), key);
            });
        });

        // 画面外を触った時などの安全対策用 AudioContext復帰
        document.addEventListener('touchstart', () => {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { passive: true });

        // 初期化実行
        initUI();
    </script>
</body>
</html>
