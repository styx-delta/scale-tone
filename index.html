<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-title" content="Scale-Tone">
  <meta name="application-name" content="Scale-Tone">
  <title>Scale-Tone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      touch-action: manipulation;
    }

    /* 鍵盤エリア全体の枠 */
    .keyboard-container {
      --gap: 8px;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    /* 黒鍵コンテナ: 8列グリッドにし、白鍵のピッチ((100% + gap) / 8)の半分だけ右へ平行移動 */
    .black-keys {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: var(--gap);
      margin-bottom: var(--gap);
      transform: translateX(calc((100% + var(--gap)) / 16));
      pointer-events: none;
    }

    /* 白鍵コンテナ: 8等分グリッド */
    .white-keys {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: var(--gap);
    }

    /* ボタン共通（完全な正方形） */
    .key-btn {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: clamp(0.95rem, 2.8vw, 1.35rem);
      line-height: 1.1;
      border-radius: 0.5rem;
      cursor: pointer;
      user-select: none;
      pointer-events: auto;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.1s, transform 0.05s, box-shadow 0.1s;
    }

    /* 白鍵内の移動ド番号（1〜8） */
    .degree-num {
      font-size: clamp(0.65rem, 1.8vw, 0.85rem);
      font-weight: 600;
      opacity: 0.55;
      margin-top: 2px;
      line-height: 1;
    }

    .white-key {
      background-color: #ffffff;
      color: #1f2937;
      border: 1px solid #d1d5db;
    }

    .black-key {
      background-color: #374151;
      color: #ffffff;
      border: 1px solid #1f2937;
    }

    /* 黒鍵がない箇所の透明スペーサー */
    .spacer {
      width: 100%;
      aspect-ratio: 1 / 1;
      visibility: hidden;
      pointer-events: none;
    }

    /* 8の白鍵の真上に配置する #/b ボタン用の枠（黒鍵行の右シフトを打ち消す） */
    .accidental-slot {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateX(calc(-1 * (100% + var(--gap)) / 2));
      pointer-events: none;
    }

    /* 控えめな灰色の #/b 切り替えボタン（鍵盤より小さめ） */
    .accidental-btn {
      width: 72%;
      height: 72%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #e5e7eb;
      color: #4b5563;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      font-weight: 600;
      font-size: clamp(0.7rem, 2vw, 0.95rem);
      cursor: pointer;
      user-select: none;
      pointer-events: auto;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      transition: background-color 0.1s, transform 0.05s;
    }

    .accidental-btn:active {
      background-color: #d1d5db;
    }

    /* 音が鳴っている時のスタイル */
    .active {
      background-color: #3b82f6 !important;
      color: #ffffff !important;
      border-color: #2563eb !important;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25) !important;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col p-3 sm:p-4 overflow-x-hidden select-none">

  <!-- 設定項目パネル -->
  <div class="flex flex-col sm:flex-row gap-3 mb-4 w-full max-w-3xl mx-auto bg-white p-3 rounded-lg shadow-sm border border-gray-200">
    <div class="flex-1">
      <label for="key-select" class="block text-xs font-bold text-gray-500 mb-1">Key (C2 - C4)</label>
      <select id="key-select" class="w-full p-2 border rounded bg-gray-50 text-base shadow-sm">
        <option value="36">C2</option>
        <option value="37">C#2 / Db2</option>
        <option value="38">D2</option>
        <option value="39">D#2 / Eb2</option>
        <option value="40">E2</option>
        <option value="41">F2</option>
        <option value="42">F#2 / Gb2</option>
        <option value="43">G2</option>
        <option value="44">G#2 / Ab2</option>
        <option value="45">A2</option>
        <option value="46">A#2 / Bb2</option>
        <option value="47">B2</option>
        <option value="48" selected>C3</option>
        <option value="49">C#3 / Db3</option>
        <option value="50">D3</option>
        <option value="51">D#3 / Eb3</option>
        <option value="52">E3</option>
        <option value="53">F3</option>
        <option value="54">F#3 / Gb3</option>
        <option value="55">G3</option>
        <option value="56">G#3 / Ab3</option>
        <option value="57">A3</option>
        <option value="58">A#3 / Bb3</option>
        <option value="59">B3</option>
        <option value="60">C4</option>
      </select>
    </div>
    <div class="flex-1">
      <label for="wave-select" class="block text-xs font-bold text-gray-500 mb-1">Waveform</label>
      <select id="wave-select" class="w-full p-2 border rounded bg-gray-50 text-base shadow-sm">
        <option value="sine" selected>Sine (純音)</option>
        <option value="square">Square (電子音)</option>
      </select>
    </div>
    <div class="flex-1">
      <label for="mode-select" class="block text-xs font-bold text-gray-500 mb-1">Mode</label>
      <select id="mode-select" class="w-full p-2 border rounded bg-gray-50 text-base shadow-sm">
        <option value="single" selected>単音 (Single)</option>
        <option value="multi">複数音 (Multi)</option>
      </select>
    </div>
  </div>

  <!-- 鍵盤エリア -->
  <div class="keyboard-container">
    <!-- 黒鍵 (上段) -->
    <div class="black-keys">
      <div class="key-btn black-key" id="key-1"><span class="note-label">C#</span></div>
      <div class="key-btn black-key" id="key-3"><span class="note-label">D#</span></div>
      <div class="spacer"></div> <!-- EとFの間 -->
      <div class="key-btn black-key" id="key-6"><span class="note-label">F#</span></div>
      <div class="key-btn black-key" id="key-8"><span class="note-label">G#</span></div>
      <div class="key-btn black-key" id="key-10"><span class="note-label">A#</span></div>
      <div class="spacer"></div> <!-- BとCの間 -->
      <div class="accidental-slot">
        <button type="button" id="accidental-toggle" class="accidental-btn"># / b</button>
      </div>
    </div>

    <!-- 白鍵 (下段) -->
    <div class="white-keys">
      <div class="key-btn white-key" id="key-0"><span class="note-label">C</span><span class="degree-num">1</span></div>
      <div class="key-btn white-key" id="key-2"><span class="note-label">D</span><span class="degree-num">2</span></div>
      <div class="key-btn white-key" id="key-4"><span class="note-label">E</span><span class="degree-num">3</span></div>
      <div class="key-btn white-key" id="key-5"><span class="note-label">F</span><span class="degree-num">4</span></div>
      <div class="key-btn white-key" id="key-7"><span class="note-label">G</span><span class="degree-num">5</span></div>
      <div class="key-btn white-key" id="key-9"><span class="note-label">A</span><span class="degree-num">6</span></div>
      <div class="key-btn white-key" id="key-11"><span class="note-label">B</span><span class="degree-num">7</span></div>
      <div class="key-btn white-key" id="key-12"><span class="note-label">C</span><span class="degree-num">8</span></div>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let baseNote = 48; // C3
    let waveType = 'sine';
    let isMultiMode = false;
    let useFlats = false;
    const activeOscillators = {};

    // 音名表記（#系 / b系）
    const sharpNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const flatNames  = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

    // 13半音のIDと基準音からの半音差のマッピング
    const intervals = {
      'key-0': 0, 'key-1': 1, 'key-2': 2, 'key-3': 3, 'key-4': 4,
      'key-5': 5, 'key-6': 6, 'key-7': 7, 'key-8': 8, 'key-9': 9,
      'key-10': 10, 'key-11': 11, 'key-12': 12
    };

    // 選択されたキーと #/b モードに合わせて13個の鍵盤のテキストを更新する
    function updateKeyLabels() {
      const names = useFlats ? flatNames : sharpNames;
      for (let i = 0; i <= 12; i++) {
        const btn = document.getElementById(`key-` + i);
        if (btn) {
          const noteIndex = (baseNote + i) % 12;
          const labelSpan = btn.querySelector('.note-label');
          if (labelSpan) {
            labelSpan.textContent = names[noteIndex];
          } else {
            btn.textContent = names[noteIndex];
          }
        }
      }
    }

    // 周波数計算 (A4 = 440Hz, MIDIノート番号69)
    function noteToFreq(note) {
      return 440 * Math.pow(2, (note - 69) / 12);
    }

    // すべての音を止める
    function stopAllNotes() {
      Object.keys(activeOscillators).forEach(id => {
        stopNote(id, document.getElementById(id));
      });
    }

    // 指定したボタンの音を止める
    function stopNote(btnId, btnElement) {
      if (activeOscillators[btnId]) {
        const { osc, gainNode } = activeOscillators[btnId];
        const now = audioCtx.currentTime;
        gainNode.gain.setValueAtTime(gainNode.gain.value, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.05);
        osc.stop(now + 0.05);
        delete activeOscillators[btnId];
        if (btnElement) {
          btnElement.classList.remove('active');
        }
      }
    }

    // 音を鳴らす（既に鳴っていれば止める）
    function playNote(interval, btnId, btnElement) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // 既に鳴っているボタンを再タップした場合は音を止める
      if (activeOscillators[btnId]) {
        stopNote(btnId, btnElement);
        return;
      }

      // 単音モードの場合は他の音を止める
      if (!isMultiMode) {
        stopAllNotes();
      }

      const currentNote = baseNote + interval;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      osc.type = waveType;
      osc.frequency.value = noteToFreq(currentNote);

      const now = audioCtx.currentTime;
      gainNode.gain.setValueAtTime(0, now);
      gainNode.gain.linearRampToValueAtTime(0.5, now + 0.05);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();

      activeOscillators[btnId] = { osc, gainNode };
      btnElement.classList.add('active');
    }

    // キー変更イベント
    document.getElementById('key-select').addEventListener('change', (e) => {
      baseNote = parseInt(e.target.value, 10);
      stopAllNotes();
      updateKeyLabels();
    });

    // 音色変更イベント
    document.getElementById('wave-select').addEventListener('change', (e) => {
      waveType = e.target.value;
      // 再生中の音があればその音色も即座に切り替える
      Object.values(activeOscillators).forEach(({ osc }) => {
        osc.type = waveType;
      });
    });

    // モード変更イベント
    document.getElementById('mode-select').addEventListener('change', (e) => {
      isMultiMode = e.target.value === 'multi';
      stopAllNotes();
    });

    // # / b 切り替えボタンイベント
    document.getElementById('accidental-toggle').addEventListener('click', () => {
      useFlats = !useFlats;
      updateKeyLabels();
    });

    // 各鍵盤ボタンにイベントを設定
    Object.keys(intervals).forEach(id => {
      const btn = document.getElementById(id);
      btn.addEventListener('click', () => {
        playNote(intervals[id], id, btn);
      });
    });

    // 初期表示時のラベル更新
    updateKeyLabels();
  </script>
</body>
</html>
