<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scale-Tone</title>
    <meta name="apple-mobile-web-app-title" content="Scale-Tone">
    <meta name="application-name" content="Scale-Tone">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 鍵盤レイアウト用カスタムCSS */
        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 4px 0; /* 行間のギャップ。列間のギャップはオーバーラップするため0 */
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .key {
            aspect-ratio: 1 / 1; /* 正方形にする */
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: clamp(0.75rem, 3vw, 1.25rem); /* スマホでもPCでも見やすい文字サイズ */
            cursor: pointer;
            user-select: none;
            touch-action: manipulation; /* スマホでのダブルタップズーム防止 */
            transition: all 0.1s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        /* 押下時のアニメーション */
        .key:active {
            transform: scale(0.95);
        }

        /* 上段（派生音/黒鍵ポジション） */
        .key-black {
            grid-row: 1;
            background-color: #374151; /* 濃いグレー */
            color: #F3F4F6;
        }

        /* 下段（幹音/白鍵ポジション） */
        .key-white {
            grid-row: 2;
            background-color: #FFFFFF;
            color: #1F2937;
        }

        /* アクティブ（発音中）のスタイル */
        .key.active {
            background-color: #3B82F6; /* ブルー */
            color: #FFFFFF;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
            border-color: #2563EB;
        }

        /* --- 各ボタンのグリッド配置（移動ドのルート音からの度数で配置） --- */
        /* 下段（白鍵）: 0(Root), 2, 4, 5, 7, 9, 11, 12(Octave) */
        .key[data-note="0"]  { grid-column: 1 / 3; }
        .key[data-note="2"]  { grid-column: 3 / 5; }
        .key[data-note="4"]  { grid-column: 5 / 7; }
        .key[data-note="5"]  { grid-column: 7 / 9; }
        .key[data-note="7"]  { grid-column: 9 / 11; }
        .key[data-note="9"]  { grid-column: 11 / 13; }
        .key[data-note="11"] { grid-column: 13 / 15; }
        .key[data-note="12"] { grid-column: 15 / 17; }

        /* 上段（黒鍵）: 1, 3, 6, 8, 10 */
        .key[data-note="1"]  { grid-column: 2 / 4; }
        .key[data-note="3"]  { grid-column: 4 / 6; }
        .key[data-note="6"]  { grid-column: 8 / 10; }
        .key[data-note="8"]  { grid-column: 10 / 12; }
        .key[data-note="10"] { grid-column: 12 / 14; }

        /* 横画面（ランドスケープ）時のスタイル調整 */
        @media (orientation: landscape) and (max-height: 500px) {
            .keyboard-grid {
                max-width: 100%;
            }
            .key {
                aspect-ratio: auto;
                height: 14vh;
            }
            /* ヘッダーなどの余白を詰める */
            .w-full.space-y-6 > :not([hidden]) ~ :not([hidden]) {
                margin-top: 0.75rem;
            }
            .mt-8 {
                margin-top: 1rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center py-8 px-4">
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center py-4 px-4 sm:py-8">

    <div class="w-full max-w-4xl space-y-4 sm:space-y-6">
        <!-- ヘッダー -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Scale-Tone</h1>
        </div>

        <!-- コントロールパネル -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-4">
            
            <!-- キー選択 -->
            <div class="flex items-center justify-between">
                <label for="keySelect" class="text-sm font-semibold text-gray-700">キー (Key)</label>
                <select id="keySelect" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-32 p-2">
                    <!-- JSで動的に追加 (C3 ~ C4) -->
                </select>
            </div>

            <!-- 音色選択 -->
            <div class="flex items-center justify-between">
                <label for="waveSelect" class="text-sm font-semibold text-gray-700">音色 (Waveform)</label>
                <select id="waveSelect" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-32 p-2">
                    <option value="sine">Sine (純音)</option>
                    <option value="sawtooth">Sawtooth (倍音)</option>
                </select>
            </div>

            <!-- モード選択 -->
            <div class="flex items-center justify-between">
                <label for="modeSelect" class="text-sm font-semibold text-gray-700">モード (Mode)</label>
                <select id="modeSelect" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-32 p-2">
                    <option value="single">単音 (Single)</option>
                    <option value="multiple">和音 (Multiple)</option>
                </select>
            </div>
        </div>

        <!-- 鍵盤エリア -->
        <div class="keyboard-grid mt-8" id="keyboard">
            <!-- 上段（黒鍵ポジション: 5個） -->
            <div class="key key-black" data-note="1"></div>
            <div class="key key-black" data-note="3"></div>
            <div class="key key-black" data-note="6"></div>
            <div class="key key-black" data-note="8"></div>
            <div class="key key-black" data-note="10"></div>
            
            <!-- 下段（白鍵ポジション: 8個） -->
            <div class="key key-white" data-note="0"></div>
            <div class="key key-white" data-note="2"></div>
            <div class="key key-white" data-note="4"></div>
            <div class="key key-white" data-note="5"></div>
            <div class="key key-white" data-note="7"></div>
            <div class="key key-white" data-note="9"></div>
            <div class="key key-white" data-note="11"></div>
            <div class="key key-white" data-note="12"></div>
        </div>
        
        <div class="text-center mt-6">
            <button id="stopAllBtn" class="px-6 py-2 bg-red-500 hover:bg-red-600 text-white text-sm font-semibold rounded-full shadow transition-colors hidden">
                すべての音を止める
            </button>
        </div>
    </div>

    <script>
        // --- Web Audio API 初期化 ---
        let audioCtx;
        const activeNotes = new Map(); // 再生中の音を管理 { interval: { osc, gain, buttonElement } }

        // --- 定数定義 ---
        // 絶対音名の配列 (シャープ系で統一、E#やB#は存在しない)
        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const A4_FREQ = 440.0;
        const A4_MIDI = 69;

        // --- DOM要素取得 ---
        const keySelect = document.getElementById('keySelect');
        const waveSelect = document.getElementById('waveSelect');
        const modeSelect = document.getElementById('modeSelect');
        const keys = document.querySelectorAll('.key');
        const stopAllBtn = document.getElementById('stopAllBtn');

        // --- 初期設定 ---
        function initUI() {
            // キー選択のプルダウンを生成 (C3: 48 ~ C4: 60)
            for (let i = 48; i <= 60; i++) {
                const option = document.createElement('option');
                option.value = i;
                const noteName = noteNames[i % 12];
                const octave = Math.floor(i / 12) - 1; // MIDI 48はC3
                option.textContent = `${noteName}${octave}`;
                keySelect.appendChild(option);
            }
            // デフォルトはC3(48)
            keySelect.value = "48";
            updateLabels();
        }

        // MIDIノート番号から周波数を計算 (A4=440Hz, 平均律)
        function getFrequency(midi) {
            return A4_FREQ * Math.pow(2, (midi - A4_MIDI) / 12);
        }

        // 鍵盤のテキスト（音名）を更新
        function updateLabels() {
            const baseMidi = parseInt(keySelect.value);
            keys.forEach(key => {
                const interval = parseInt(key.dataset.note); // 0〜12
                const midi = baseMidi + interval;
                key.textContent = noteNames[midi % 12];
            });
        }

        // 音を鳴らす
        function playNote(interval, buttonElement) {
            // AudioContextが未作成、またはサスペンド状態なら起動
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const mode = modeSelect.value;
            
            // 既に鳴っているボタンをタップした場合は止める（トグル）
            // これを単音モードの全停止より先に判定することで、自身をタップした時のオフを実現
            if (activeNotes.has(interval)) {
                stopNote(interval);
                return;
            }

            // 単音モードの場合、鳴らす前に（他の）音をすべて止める
            if (mode === 'single') {
                stopAllNotes();
            }

            // 周波数計算
            const baseMidi = parseInt(keySelect.value);
            const midi = baseMidi + interval;
            const freq = getFrequency(midi);

            // オシレーターとゲイン（音量）ノードの作成
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = waveSelect.value; // sine or sawtooth
            osc.frequency.value = freq;

            // 音量設定とフェードイン（プツッというノイズを防ぐ）
            // 音色はsawtoothの方が体感音量が大きいため少し調整
            const maxVol = waveSelect.value === 'sawtooth' ? 0.05 : 0.2;
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(maxVol, audioCtx.currentTime + 0.02);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();

            // 状態の保存とUI更新
            activeNotes.set(interval, { osc, gain, buttonElement });
            buttonElement.classList.add('active');
            updateStopBtnVisibility();
        }

        // 特定の音を止める
        function stopNote(interval) {
            const note = activeNotes.get(interval);
            if (note) {
                // AudioContextの状態確認（横画面回転時などにサスペンドされている場合の対策）
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // フェードアウトさせてから停止（ノイズ防止）
                note.gain.gain.cancelScheduledValues(audioCtx.currentTime);
                note.gain.gain.setValueAtTime(note.gain.gain.value, audioCtx.currentTime);
                note.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                note.osc.stop(audioCtx.currentTime + 0.05);
                
                note.buttonElement.classList.remove('active');
                activeNotes.delete(interval);
                updateStopBtnVisibility();
            }
        }

        // すべての音を止める
        function stopAllNotes() {
            for (let interval of activeNotes.keys()) {
                stopNote(interval);
            }
        }

        // 「すべて止める」ボタンの表示制御
        function updateStopBtnVisibility() {
            if (activeNotes.size > 0 && modeSelect.value === 'multiple') {
                stopAllBtn.classList.remove('hidden');
            } else {
                stopAllBtn.classList.add('hidden');
            }
        }

        // --- イベントリスナー ---

        // iOS Safari等での画面回転時のAudioContextサスペンド対策
        const resumeAudioContext = () => {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        };
        window.addEventListener('resize', resumeAudioContext);
        window.addEventListener('orientationchange', resumeAudioContext);
        document.addEventListener('touchstart', resumeAudioContext, { passive: true });

        // キーが変更されたら音を止めてラベルを更新
        keySelect.addEventListener('change', () => {
            stopAllNotes();
            updateLabels();
        });

        // モード変更時も念のためリセット
        modeSelect.addEventListener('change', () => {
            stopAllNotes();
        });

        // 音色変更時もリセット（再生中の音色を動的変更するより安定するため）
        waveSelect.addEventListener('change', () => {
            stopAllNotes();
        });

        // 「すべて止める」ボタン
        stopAllBtn.addEventListener('click', stopAllNotes);

        // 各鍵盤ボタンのイベント
        // clickの代わりに pointerdown を使うことで、スマホでの反応速度向上とAudioContextの確実な再開を狙う
        keys.forEach(key => {
            key.addEventListener('pointerdown', (e) => {
                e.preventDefault(); // タッチ時の不要なスクロールやダブルタップズーム動作を防止
                playNote(parseInt(key.dataset.note), key);
            });
        });

        // 実行
        initUI();

    </script>
</body>
</html>
