<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scale-Tone</title>
    <meta name="apple-mobile-web-app-title" content="Scale-Tone">
    <meta name="application-name" content="Scale-Tone">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ピアノ配列用グリッド */
        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 8px 0; /* 上下（白鍵・黒鍵間）の隙間。左右はオーバーラップで配置 */
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            align-content: center;
        }

        /* 鍵盤の基本スタイル (完全な正方形) */
        .key {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: clamp(0.75rem, 3.5vw, 1.25rem);
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .key:active {
            transform: scale(0.95);
        }

        /* 黒鍵（上段） */
        .key-black {
            grid-row: 1;
            background-color: #374151; /* 濃いグレー */
            color: #F3F4F6;
        }

        /* 白鍵（下段） */
        .key-white {
            grid-row: 2;
            background-color: #FFFFFF;
            color: #1F2937;
        }

        /* アクティブ状態 */
        .key.active {
            background-color: #3B82F6; /* ブルー */
            color: #FFFFFF;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
            border-color: #2563EB;
        }

        /* --- グリッド配置（16カラム中2カラムずつ占有し、半音ズラす） --- */
        .key[data-note="0"]  { grid-column: 1 / 3; }   /* 白 C */
        .key[data-note="1"]  { grid-column: 2 / 4; }   /* 黒 C# */
        .key[data-note="2"]  { grid-column: 3 / 5; }   /* 白 D */
        .key[data-note="3"]  { grid-column: 4 / 6; }   /* 黒 D# */
        .key[data-note="4"]  { grid-column: 5 / 7; }   /* 白 E */
        .key[data-note="5"]  { grid-column: 7 / 9; }   /* 白 F */
        .key[data-note="6"]  { grid-column: 8 / 10; }  /* 黒 F# */
        .key[data-note="7"]  { grid-column: 9 / 11; }  /* 白 G */
        .key[data-note="8"]  { grid-column: 10 / 12; } /* 黒 G# */
        .key[data-note="9"]  { grid-column: 11 / 13; } /* 白 A */
        .key[data-note="10"] { grid-column: 12 / 14; } /* 黒 A# */
        .key[data-note="11"] { grid-column: 13 / 15; } /* 白 B */
        .key[data-note="12"] { grid-column: 15 / 17; } /* 白 C(上) */
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col px-4 py-6 sm:py-10">

    <div class="w-full max-w-4xl mx-auto flex flex-col flex-grow">
        
        <!-- ヘッダーエリア -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Scale-Tone</h1>
            <button id="toggleSettingsBtn" class="px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors">
                ⚙️ 設定
            </button>
        </div>

        <!-- コントロールパネル（折りたたみ対象） -->
        <div id="settingsPanel" class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-gray-100 mb-8 transition-all duration-300 origin-top">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- キー選択 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">キー (Key)</label>
                    <select id="keySelect" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5">
                        <!-- JSで動的に追加 (C3 ~ C4) -->
                    </select>
                </div>
                <!-- 音色選択 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">音色 (Waveform)</label>
                    <select id="waveSelect" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5">
                        <option value="sine">Sine (純音)</option>
                        <option value="square">Square (電子音)</option>
                    </select>
                </div>
                <!-- モード選択 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">モード (Mode)</label>
                    <select id="modeSelect" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5">
                        <option value="single">単音 (Single)</option>
                        <option value="multiple">和音 (Multiple)</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-4 pt-4 border-t border-gray-100 text-right">
                <button id="stopAllBtn" class="px-5 py-2 bg-red-500 hover:bg-red-600 text-white text-sm font-semibold rounded-lg shadow transition-colors hidden">
                    すべての音を止める
                </button>
            </div>
        </div>

        <!-- 鍵盤エリア -->
        <div class="flex-grow flex items-center justify-center pb-8">
            <div class="keyboard-grid w-full" id="keyboard">
                <!-- 上段（黒鍵） -->
                <div class="key key-black" data-note="1"></div>
                <div class="key key-black" data-note="3"></div>
                <div class="key key-black" data-note="6"></div>
                <div class="key key-black" data-note="8"></div>
                <div class="key key-black" data-note="10"></div>
                
                <!-- 下段（白鍵） -->
                <div class="key key-white" data-note="0"></div>
                <div class="key key-white" data-note="2"></div>
                <div class="key key-white" data-note="4"></div>
                <div class="key key-white" data-note="5"></div>
                <div class="key key-white" data-note="7"></div>
                <div class="key key-white" data-note="9"></div>
                <div class="key key-white" data-note="11"></div>
                <div class="key key-white" data-note="12"></div>
            </div>
        </div>
        
    </div>

    <script>
        // --- Web Audio API 初期化 ---
        let audioCtx;
        const activeNotes = new Map();

        // --- 定数定義 ---
        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const A4_FREQ = 440.0;
        const A4_MIDI = 69;

        // --- DOM要素 ---
        const keySelect = document.getElementById('keySelect');
        const waveSelect = document.getElementById('waveSelect');
        const modeSelect = document.getElementById('modeSelect');
        const keys = document.querySelectorAll('.key');
        const stopAllBtn = document.getElementById('stopAllBtn');
        const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');

        // --- 初期設定 ---
        function initUI() {
            // キー選択 (C3: 48 ~ C4: 60)
            for (let i = 48; i <= 60; i++) {
                const option = document.createElement('option');
                option.value = i;
                const noteName = noteNames[i % 12];
                const octave = Math.floor(i / 12) - 1;
                option.textContent = `${noteName}${octave}`;
                keySelect.appendChild(option);
            }
            keySelect.value = "48";
            updateLabels();
        }

        function getFrequency(midi) {
            return A4_FREQ * Math.pow(2, (midi - A4_MIDI) / 12);
        }

        function updateLabels() {
            const baseMidi = parseInt(keySelect.value);
            keys.forEach(key => {
                const interval = parseInt(key.dataset.note);
                const midi = baseMidi + interval;
                key.textContent = noteNames[midi % 12];
            });
        }

        function playNote(interval, buttonElement) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const mode = modeSelect.value;
            
            if (activeNotes.has(interval)) {
                stopNote(interval);
                return;
            }

            if (mode === 'single') {
                stopAllNotes();
            }

            const baseMidi = parseInt(keySelect.value);
            const freq = getFrequency(baseMidi + interval);

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = waveSelect.value;
            osc.frequency.value = freq;

            const maxVol = waveSelect.value === 'square' ? 0.05 : 0.2;
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(maxVol, audioCtx.currentTime + 0.02);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();

            activeNotes.set(interval, { osc, gain, buttonElement });
            buttonElement.classList.add('active');
            updateStopBtnVisibility();
        }

        function stopNote(interval) {
            const note = activeNotes.get(interval);
            if (note) {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                note.gain.gain.cancelScheduledValues(audioCtx.currentTime);
                note.gain.gain.setValueAtTime(note.gain.gain.value, audioCtx.currentTime);
                note.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                note.osc.stop(audioCtx.currentTime + 0.05);
                
                note.buttonElement.classList.remove('active');
                activeNotes.delete(interval);
                updateStopBtnVisibility();
            }
        }

        function stopAllNotes() {
            for (let interval of activeNotes.keys()) {
                stopNote(interval);
            }
        }

        function updateStopBtnVisibility() {
            if (activeNotes.size > 0 && modeSelect.value === 'multiple') {
                stopAllBtn.classList.remove('hidden');
            } else {
                stopAllBtn.classList.add('hidden');
            }
        }

        // --- イベントリスナー ---
        
        // 設定パネルの開閉
        toggleSettingsBtn.addEventListener('click', () => {
            if (settingsPanel.classList.contains('hidden')) {
                settingsPanel.classList.remove('hidden');
                settingsPanel.style.opacity = 1;
                settingsPanel.style.transform = "scaleY(1)";
                // 少し遅らせてdisplayを変更しないとアニメーションが効かないためシンプルにhiddenトグル
            } else {
                settingsPanel.classList.add('hidden');
            }
        });

        const resumeAudioContext = () => {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        };
        window.addEventListener('resize', resumeAudioContext);
        document.addEventListener('touchstart', resumeAudioContext, { passive: true });

        keySelect.addEventListener('change', () => { stopAllNotes(); updateLabels(); });
        modeSelect.addEventListener('change', stopAllNotes);
        waveSelect.addEventListener('change', stopAllNotes);
        stopAllBtn.addEventListener('click', stopAllNotes);

        keys.forEach(key => {
            key.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                playNote(parseInt(key.dataset.note), key);
            });
        });

        initUI();
    </script>
</body>
</html>
